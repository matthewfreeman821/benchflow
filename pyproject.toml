[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "benchflow"
version = "0.1.0"
description = "Local repair-shop workflow and account-safe service history"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.13,<3.14"
dependencies = [
  "argon2-cffi>=23.1,<26",
  "fastapi>=0.115,<1",
  "pydantic>=2.10,<3",
  "tzdata>=2024.2",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
test = [
  "httpx>=0.27,<1",
  "pytest>=8.3,<9",
]

[tool.setuptools.packages.find]
include = ["backend*", "config*", "contracts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "integration: invokes the real local API, persistence, and restart boundary",
]
